<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>워라하 | 딜레마 질문 생성기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#243b35;font:16px/1.7 system-ui,sans-serif}header{background:#173e36;color:white;padding:32px max(5%,calc((100% - 1100px)/2))}h1{font-size:30px;margin:5px 0}h2{font-size:21px;margin:0 0 16px}small{letter-spacing:2px}main{max-width:1140px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}section,aside{background:white;border:1px solid #dce5de;border-radius:16px;padding:24px}label{display:block;font-size:13px;font-weight:bold;margin-top:14px}select,textarea{width:100%;font:inherit;border:1px solid #cbd8cf;border-radius:8px;padding:10px;background:#fff;color:inherit}button{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:bold;cursor:pointer;background:#23664f;color:white;margin:5px 3px 5px 0}button.secondary{background:#e8efe9;color:#24513e}button:disabled{opacity:.4;cursor:default}.full{width:100%;margin-top:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#edf4f0;padding:16px;border-radius:10px}.choice:last-child{background:#faf1e4}.tag{font-size:13px;color:#547565}.progress{display:flex;gap:5px;margin:12px 0}.progress span{height:6px;flex:1;background:#dce5de;border-radius:8px}.progress .on{background:#328467}hr{border:0;border-top:1px solid #e2e8e3;margin:24px 0}textarea{min-height:130px;resize:vertical}#status{font-size:13px;color:#23664f}footer{max-width:1100px;margin:20px auto;padding:0 20px;color:#64756c;font-size:13px}@media(max-width:720px){main{grid-template-columns:1fr}.choices{grid-template-columns:1fr}header{padding:24px}h1{font-size:24px}}</style></head><body><header><small>WORAHA × CONUNDRUM</small><h1>딜레마 질문 생성기</h1>갈등에서 사고로, 사고에서 새로운 가치로</header><main><aside><h2>학습 설정</h2><label for="age">학습자 수준</label><select id="age"></select><label for="topic">주제 영역</label><select id="topic"></select><label for="level">난이도</label><select id="level"></select><label for="goal">핵심 사고 역량</label><select id="goal"></select><button class="full" id="generate">딜레마 생성하기</button><button class="secondary full" id="copy">AI 훈련 프롬프트 복사</button><p id="status" role="status"></p><p class="tag">내장 사례 기반 생성기 · 인터넷 및 API 키 불필요</p></aside><section><div id="case"></div><hr><div id="training"></div></section></main><footer>워라하 교육과정 · 적용 → 활용 → 창조 → 나눔 | 모든 사례는 사고 훈련용 가상 상황입니다.</footer><script>
const $=id=>document.getElementById(id);const options={age:['초등 저학년','초등 중학년','초등 고학년','중·고등학생','성인'],topic:['AI와 미래사회','윤리와 도덕','친구와 인간관계','학교생활','환경과 생태','경제와 창업','과학과 기술','공동체와 사회문제'],level:['쉬움','보통','어려움'],goal:['관점 전환 및 대안 생성','논리적 판단과 근거 탐색','제1원리 사고','창조적 문제 해결','종합적 사고력']};for(const [id,arr] of Object.entries(options))arr.forEach(v=>$(id).add(new Option(v,v)));$('age').selectedIndex=4;$('level').selectedIndex=1;
// Each topic contains a younger and an older learner case.
const bank=[
[['AI 숙제','숙제 마감이 다가오는데 AI는 글을 빠르게 만들어 줄 수 있다.','AI 도움으로 완성하기','시간 절약','직접 생각할 기회 감소','혼자 작성하기','스스로 배우는 경험','제출이 늦어질 가능성','제출까지 10분'],['AI와 일자리','직원 100명의 회사가 AI를 도입하면 60명으로 같은 일을 할 수 있다. 경쟁사는 이미 비용을 줄이고 있다.','AI 도입과 인력 감축','경쟁력과 생존 가능성','40명의 고용 불안','고용 유지','직원의 생계와 신뢰','비용 부담과 경쟁력 저하','재정 여유는 2년이며 추가 지원은 불확실하다.']],
[['친구의 실수','친구가 교실 물건을 망가뜨리고 비밀로 해 달라고 한다.','사실 알리기','정직과 책임','친구가 속상할 수 있음','비밀 지키기','친구와의 약속','문제 해결 지연','선생님이 지금 물어보고 있다.'],['동료의 실수','동료의 실수가 고객에게 손해를 줄 수 있다. 동료는 스스로 해결할 시간을 요청한다.','즉시 보고','고객 보호','동료의 신뢰 손상','시간 주기','동료의 자율성과 신뢰','손해 확대 위험','고객에게 답할 시간이 하루뿐이다.']],
[['놀이 팀','친한 친구와 실력이 좋은 친구 중 한 명만 팀에 넣을 수 있다.','친한 친구 선택','우정','팀의 기대와 충돌','실력 기준 선택','공정한 경쟁','친구의 서운함','남은 자리는 하나이다.'],['친구의 부탁','친구가 중요한 면접 준비를 도와 달라고 하지만 가족과의 약속이 있다.','친구 돕기','우정과 연대','가족 약속 변경','가족 약속 지키기','가족과의 신뢰','친구의 준비 부족','두 일정이 같은 시간이다.']],
[['학교 공간','학교 텃밭을 없애면 놀이 공간을 넓힐 수 있다.','운동장 확대','놀이 기회','텃밭 경험 감소','텃밭 유지','생태 경험','놀이 공간 부족','사용할 땅은 한정되어 있다.'],['학교 예산','학교에 디지털 기기와 도서관 개선이 모두 필요하다.','디지털 기기 구매','AI 학습 기회','독서 환경 개선 지연','도서관 개선','집중과 독서 경험','디지털 접근 격차 지속','올해 예산으로는 한 사업만 가능하다.']],
[['일회용 컵','학교 행사에서 일회용 컵을 쓰면 준비가 쉽다.','일회용 컵 사용','편리함','쓰레기 증가','다회용 컵 사용','환경 보호','세척 부담','행사 준비 인원이 적다.'],['지역 개발','지역에 공장을 세우면 일자리가 생기지만 숲 일부가 사라진다.','공장 유치','고용과 세수','생태계 훼손','숲 보존','환경과 장기 가치','일자리 기회 감소','대체 부지 확보가 어렵다.']],
[['학급 장터','장터에서 저렴한 재료를 쓰면 더 많은 수익을 낼 수 있다.','저렴한 재료','수익 증가','품질 저하 가능성','좋은 재료','품질과 만족','수익 감소','재료비는 3만원이다.'],['가게의 가격','원재료 가격이 올라 작은 가게의 수익이 줄었다.','가격 인상','사업 유지','고객 부담','가격 유지','고객 접근성','수익 악화','임대료와 인건비는 줄이기 어렵다.']],
[['안전한 로봇','학교에 새 로봇을 들이면 편리하지만 아직 안전 시험이 끝나지 않았다.','제한적으로 사용','새로운 경험','안전 불확실성','시험 완료까지 기다리기','안전','학습 기회 지연','체험 행사는 이번 주이다.'],['의료 AI','병원이 진단 AI를 도입하면 대기 시간을 줄일 수 있지만 일부 집단의 정확도가 충분히 검증되지 않았다.','제한적 도입','진료 접근성','오류와 불평등 위험','검증까지 보류','안전과 공정성','대기 시간 지속','의료진과 예산이 부족하다.']],
[['공원 사용','공원에서 공놀이를 하는 사람과 조용히 쉬고 싶은 사람이 있다.','공놀이 허용','활동의 자유','소음','조용한 공간 유지','휴식','놀이 기회 감소','공원은 하나뿐이다.'],['공공 예산','지역의 한정된 예산으로 노인 돌봄과 청년 주거를 모두 충분히 지원하기 어렵다.','노인 돌봄 우선','긴급한 돌봄 필요 충족','청년 주거 부담 지속','청년 주거 우선','미래 정착 기반','돌봄 공백 지속','추가 예산 확보는 불확실하다.']]];
let state=null;const names=['최초 판단','근거 탐색','역지사지','제1원리 분해','대안 생성','성찰'];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function settings(){return Object.fromEntries(Object.keys(options).map(k=>[k,$(k).value]))}function generate(){if(state&&state.answers.some(a=>a.trim())&&!confirm('새 문제를 만들면 현재 답변이 초기화됩니다. 계속할까요?'))return;const s=settings(),young=$('age').selectedIndex<3;const c=bank[$('topic').selectedIndex][young?0:1];state={s,c,step:0,answers:Array(6).fill(''),finished:false};render();save()}
function questions(){let {s,c}=state;let q=['너라면 어떤 선택을 하겠니?','그렇게 판단한 가장 중요한 이유는 무엇이니?','반대 선택을 지지하는 사람의 입장에서는 무엇이 가장 중요할까?','이 문제에서 확인된 사실과 아직 확인되지 않은 가정을 어떻게 구분할 수 있을까?','두 선택의 장점을 살릴 수 있는 새로운 방법은 무엇일까?','처음 판단과 지금 판단은 어떻게 달라졌니?'];if(s.age==='성인'||s.age==='중·고등학생')q=['당신이라면 어떤 결정을 내리겠습니까?','그 판단을 뒷받침하는 가장 중요한 근거는 무엇입니까?','반대 입장의 이해관계자는 당신의 결정을 어떻게 평가할까요?','이 문제의 사실, 가정, 핵심 제약을 어떻게 구분할 수 있을까요?','두 가치의 손실을 줄이는 실행 가능한 제3의 대안은 무엇입니까?','처음 판단과 지금 판단은 어떻게 달라졌습니까?'];if(s.level==='쉬움')q[3]='이 상황에서 꼭 지켜야 하는 조건은 무엇인가요?';if(s.level==='어려움')q[4]='제한된 자원 안에서 두 가치를 함께 보호할 대안을 만들고, 그 대안이 실패할 조건까지 고려한다면 어떻게 설계하겠습니까?';if(s.goal==='제1원리 사고')q[3]='당연하다고 여긴 전제 중 바꿀 수 있는 것과 바꿀 수 없는 것은 무엇인가요?';if(s.goal==='논리적 판단과 근거 탐색')q[1]='판단을 뒷받침할 근거와 그 근거를 확인할 방법은 무엇인가요?';if(s.goal==='창조적 문제 해결')q[4]='작은 규모로 시험할 수 있는 새로운 해결책은 무엇인가요?';if(s.goal==='종합적 사고력')q[5]='판단의 변화와 앞으로 실천할 행동을 어떻게 연결할 수 있나요?';return q}
function render(){let {s,c,step,finished,answers}=state;let extra=s.level==='어려움'?' 결정에 영향을 받는 사람들의 의견도 서로 다르며, 결정 후 쉽게 되돌리기 어렵다.':'';$('case').innerHTML=`<div class="tag">${esc(s.age)} · ${esc(s.level)} · ${esc(s.goal)}</div><h2>${esc(c[0])}</h2><p>${esc(c[1]+extra)}</p><div class="choices">${[2,5].map((n,i)=>`<div class="choice"><b>선택 ${i?'B':'A'} · ${esc(c[n])}</b><p>얻는 것: ${esc(c[n+1])}<br>부담: ${esc(c[n+2])}</p></div>`).join('')}</div><p><b>제약 조건</b> · ${esc(c[8])}</p>`;if(finished){$('training').innerHTML='<h2>나의 사고 기록</h2>'+answers.map((a,i)=>`<p><b>${names[i]}</b><br>${esc(a).replace(/\n/g,'<br>')}</p>`).join('')+'<button id="export">기록 저장 (.txt)</button><button class="secondary" id="review">답변 수정</button>';$('export').onclick=download;$('review').onclick=()=>{state.finished=false;render();save()};return} $('training').innerHTML=`<div class="tag">STEP ${step+1} / 6 · ${names[step]}</div><div class="progress">${names.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><h2>${esc(questions()[step])}</h2><label for="answer">나의 생각</label><textarea id="answer" placeholder="자신의 생각을 자유롭게 적어 보세요.">${esc(answers[step])}</textarea><button class="secondary" id="prev" ${step===0?'disabled':''}>이전</button><button id="next" ${answers[step].trim()?'':'disabled'}>${step===5?'훈련 마치기':'다음 질문'}</button><button class="secondary" id="export">기록 저장</button>`;$('answer').oninput=e=>{state.answers[step]=e.target.value;$('next').disabled=!e.target.value.trim();save()};$('prev').onclick=()=>{state.step--;render();save()};$('next').onclick=()=>{if(!state.answers[step].trim())return;if(step===5)state.finished=true;else state.step++;render();save()};$('export').onclick=download}
function save(){try{localStorage.setItem('woraha-dilemma-v1',JSON.stringify(state))}catch(e){$('status').textContent='브라우저 자동 저장을 사용할 수 없습니다.'}}function download(){const t=state.c[0]+'\n'+state.c[1]+'\n'+questions().map((q,i)=>`${names[i]}\n${q}\n${state.answers[i]}`).join('\n\n');const u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='딜레마_사고기록.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('generate').onclick=generate;$('copy').onclick=async()=>{const s=settings();const t=`${s.age} 학습자를 대상으로 ${s.topic} 영역의 ${s.level} 난이도 딜레마를 만들어줘. 핵심 역량은 ${s.goal}이야. 실생활 상황, 가치 충돌, 양쪽 선택의 장단점과 현실적 제약을 제시해줘. 최초 판단→근거 탐색→역지사지→제1원리 분해→대안 생성→성찰 순서로 학습자의 응답에 맞춰 한 번에 한 질문씩 진행하고 정답을 강요하지 마.`;try{await navigator.clipboard.writeText(t);$('status').textContent='프롬프트를 복사했습니다.'}catch(e){window.prompt('아래 프롬프트를 복사하세요.',t)}};try{state=JSON.parse(localStorage.getItem('woraha-dilemma-v1'));if(state){for(const k of Object.keys(options))$(k).value=state.s[k];render()}else generate()}catch(e){state=null;generate()}
</script></body></html>
